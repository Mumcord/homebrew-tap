name: Follow Mumcord releases

# Checks for a new Mumcord release and points the cask and the formula at it. Only stable
# releases count: `gh release view` without a tag ignores drafts and pre-releases.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update to the latest release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(scripts/bump.sh)" >>"$GITHUB_OUTPUT"
      - name: Commit
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mumcord $VERSION"
          git push
